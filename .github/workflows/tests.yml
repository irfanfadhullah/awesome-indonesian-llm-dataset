name: Dataset toolkit
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_inventory.py --check
      - run: python scripts/build_catalog.py --check
      - run: python scripts/report_coverage.py --check
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: indo-datasets list
      - run: indo-datasets sources --query nusax
      - run: indo-datasets catalog --summary
      - run: indo-datasets plan --all-sources --limit 1 --output /tmp/catalog-plan.json
